<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exo-Defense: Fixed & Balanced</title>
    <style>
        body { margin: 0; background: #050510; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: radial-gradient(circle, #0a0a1a 0%, #000 100%); border: 2px solid #1a3a5a; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; width: 350px; }
        .stat { margin-bottom: 8px; text-shadow: 0 0 8px #0ff; font-size: 18px; font-weight: bold; }
        #shop, #upgrade-menu { position: absolute; bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 95%; max-width: 1000px; }
        #upgrade-menu { display: none; background: rgba(0,20,40,0.95); padding: 15px; border: 2px solid #0ff; border-radius: 8px; pointer-events: auto; }
        .btn { background: rgba(0,200,255,0.1); border: 1px solid #0ff; color: #0ff; padding: 10px; cursor: pointer; pointer-events: auto; transition: 0.2s; font-size: 12px; display: flex; flex-direction: column; align-items: center; min-width: 130px; border-radius: 4px; }
        .btn:hover { background: rgba(0,255,255,0.2); box-shadow: 0 0 15px #0ff; }
        .btn.active { background: #0ff; color: #000; font-weight: bold; }
        .btn span { font-size: 10px; opacity: 0.8; margin-top: 4px; }
        .repair-btn { border-color: #0f0; color: #0f0; }
        .close-btn { border-color: #f44; color: #f44; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">INTEGRITY: <span id="health">100</span>%</div>
        <div class="stat">SCRAP: <span id="money">100</span></div>
        <div class="stat">WAVE: <span id="wave">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="shop">
        <button class="btn repair-btn" onclick="repairPlanet()">REPAIR<span>50 SCRAP</span></button>
        <button class="btn" id="btn-BEAM" onclick="setTurret('BEAM')">LASER<span>25</span></button>
        <button class="btn" id="btn-PULSE" onclick="setTurret('PULSE')">PULSE<span>60</span></button>
        <button class="btn" id="btn-MINER" onclick="setTurret('MINER')">MINER<span>40</span></button>
        <button class="btn" id="btn-GRAVITY" onclick="setTurret('GRAVITY')">SLOW<span>75</span></button>
        <button class="btn" id="btn-RAILGUN" onclick="setTurret('RAILGUN')">RAILGUN<span>120</span></button>
    </div>

    <div id="upgrade-menu">
        <div style="width:100%; text-align:center; margin-bottom:10px; color:#fff;" id="upgrade-title">UPGRADES</div>
        <button class="btn" onclick="upgradeStat('damage')">DAMAGE <span id="up-dmg-cost">30</span></button>
        <button class="btn" onclick="upgradeStat('range')">RANGE <span id="up-rng-cost">30</span></button>
        <button class="btn" onclick="upgradeStat('rate')">SPEED <span id="up-spd-cost">30</span></button>
        <button class="btn close-btn" onclick="deselectTurret()">CLOSE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1000; canvas.height = 600;

        let health = 100, money = 120, wave = 0;
        let enemies = [], turrets = [], projectiles = [], particles = [];
        let selectedType = null, selectedTurret = null, waveActive = false;

        const TURRET_DEFS = {
            BEAM: { cost: 25, range: 160, damage: 3, rate: 25, color: '#0ff', type: 'ATTACK' },
            PULSE: { cost: 60, range: 220, damage: 12, rate: 50, color: '#f0f', type: 'ATTACK' },
            MINER: { cost: 40, range: 0, damage: 0, rate: 120, color: '#ff0', type: 'ECON' },
            GRAVITY: { cost: 75, range: 140, damage: 0, rate: 1, color: '#55f', type: 'SLOW' },
            RAILGUN: { cost: 120, range: 500, damage: 60, rate: 140, color: '#fff', type: 'ATTACK' }
        };

        const planet = { x: canvas.width/2, y: canvas.height/2, r: 60 };

        function setTurret(type) {
            selectedType = type; deselectTurret();
            document.querySelectorAll('#shop .btn').forEach(b => b.classList.remove('active'));
            if(type) document.getElementById('btn-' + type).classList.add('active');
        }

        function deselectTurret() {
            selectedTurret = null;
            document.getElementById('upgrade-menu').style.display = 'none';
            document.getElementById('shop').style.display = 'flex';
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const t = turrets.find(t => Math.hypot(t.x - x, t.y - y) < 25);
            if (t) {
                selectedTurret = t; setTurret(null);
                document.getElementById('shop').style.display = 'none';
                document.getElementById('upgrade-menu').style.display = 'flex';
                updateUpgradeUI();
                return;
            }

            if (selectedType) {
                const dist = Math.hypot(x - planet.x, y - planet.y);
                if (dist > planet.r + 30 && dist < 420 && money >= TURRET_DEFS[selectedType].cost) {
                    money -= TURRET_DEFS[selectedType].cost;
                    turrets.push({ x, y, ...TURRET_DEFS[selectedType], level: 1, timer: 0 });
                    updateUI();
                }
            }
        });

        function updateUpgradeUI() {
            const cost = 30 * selectedTurret.level;
            document.getElementById('upgrade-title').innerText = `${selectedTurret.type} (LVL ${selectedTurret.level})`;
            document.getElementById('up-dmg-cost').innerText = `${cost} SCRAP`;
            document.getElementById('up-rng-cost').innerText = `${cost} SCRAP`;
            document.getElementById('up-spd-cost').innerText = `${cost} SCRAP`;
        }

        function upgradeStat(stat) {
            const cost = 30 * selectedTurret.level;
            if (money >= cost) {
                money -= cost;
                selectedTurret.level++;
                if (stat === 'damage') selectedTurret.damage *= 1.5;
                if (stat === 'range') selectedTurret.range += 40;
                if (stat === 'rate') selectedTurret.rate = Math.max(5, selectedTurret.rate * 0.7);
                updateUpgradeUI(); updateUI();
            }
        }

        function repairPlanet() { if (money >= 50 && health < 100) { money -= 50; health = Math.min(100, health + 25); updateUI(); } }

        function updateUI() {
            document.getElementById('health').innerText = Math.round(health);
            document.getElementById('money').innerText = Math.floor(money);
            document.getElementById('wave').innerText = wave;
        }

        function spawnWave() {
            wave++; waveActive = true;
            let count = 6 + (wave * 2);
            let isBoss = wave % 5 === 0;
            for (let i = 0; i < (isBoss ? count + 1 : count); i++) {
                setTimeout(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const boss = isBoss && i === 0;
                    enemies.push({
                        x: planet.x + Math.cos(angle)*700, y: planet.y + Math.sin(angle)*700,
                        hp: (4 + wave * 3) * (boss ? 8 : 1), maxHp: (4 + wave * 3) * (boss ? 8 : 1),
                        speed: boss ? 0.4 : 0.8 + (wave * 0.05), size: boss ? 40 : 12, boss
                    });
                    if(i === count - 1) waveActive = false;
                }, i * 500);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.r, 0, Math.PI*2);
            ctx.fillStyle = '#102545'; ctx.fill();
            ctx.strokeStyle = health > 30 ? '#0ff' : '#f44'; ctx.lineWidth = 4; ctx.stroke();

            enemies.forEach((en, i) => {
                let speedMod = 1;
                turrets.filter(t => t.type === 'SLOW').forEach(t => { if(Math.hypot(en.x-t.x, en.y-t.y) < t.range) speedMod = 0.5; });
                const dx = planet.x-en.x, dy = planet.y-en.y, dist = Math.hypot(dx, dy);
                en.x += (dx/dist)*en.speed*speedMod; en.y += (dy/dist)*en.speed*speedMod;
                ctx.fillStyle = en.boss ? '#f0f' : '#f44'; ctx.fillRect(en.x-en.size/2, en.y-en.size/2, en.size, en.size);
                if (dist < planet.r) { health -= en.boss ? 40 : 8; enemies.splice(i,1); updateUI(); }
            });

            turrets.forEach(t => {
                ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI*2); ctx.fill();
                if(selectedTurret === t) { ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2); ctx.stroke(); }
                t.timer++;
                if (t.timer >= t.rate) {
                    if(t.type === 'ECON') { money += (4 + t.level); updateUI(); }
                    else if (t.type === 'ATTACK') {
                        const target = enemies.find(en => Math.hypot(en.x-t.x, en.y-t.y) < t.range);
                        if (target) projectiles.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, color: t.color, damage: t.damage });
                    }
                    t.timer = 0;
                }
            });

            projectiles.forEach((p, i) => {
                const dx = p.tx-p.x, dy = p.ty-p.y, dist = Math.hypot(dx, dy);
                if (dist < 15) {
                    const en = enemies.find(e => Math.hypot(e.x-p.tx, e.y-p.ty) < 40);
                    if (en) { en.hp -= p.damage; if (en.hp <= 0) { money += en.boss ? 80 : 10; enemies.splice(enemies.indexOf(en), 1); updateUI(); } }
                    projectiles.splice(i, 1);
                } else { p.x += (dx/dist)*20; p.y += (dy/dist)*20; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x-(dx/dist)*15, p.y-(dy/dist)*15); ctx.stroke(); }
            });

            if (enemies.length === 0 && !waveActive && health > 0) spawnWave();
            if (health > 0) requestAnimationFrame(gameLoop);
            else { ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#f00'; ctx.textAlign='center'; ctx.font='40px Arial'; ctx.fillText('ORBIT FAILED', canvas.width/2, canvas.height/2); }
        }

        updateUI(); spawnWave(); gameLoop();
    </script>
</body>
</html>
